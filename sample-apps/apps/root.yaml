apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-apps-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/patakib/kind-argocd.git
    targetRevision: app-of-apps
    path: sample-apps/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
