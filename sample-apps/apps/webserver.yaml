apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webserver
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/patakib/kind-argocd.git
    targetRevision: app-of-apps
    path: sample-apps/webserver/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
